name: New Issue
description: Create a new Omega Star development issue
type: bug
assignees:
  - HILEANDR

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Describe the issue or requested change
    validations:
      required: true

  - type: dropdown
    id: department
    attributes:
      label: Department
      options:
        - Gameplay
        - Art
      default: 0
    validations:
      required: true

name: Assign Omega Star issues by Department and status

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assign-by-status:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.OMEGASTAR_PROJECT_TOKEN }}
    steps:
      - name: Assign Gameplay Todo to Andrew and testing issues to Callum or Robert
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Add OMEGASTAR_PROJECT_TOKEN to the repository Actions secrets."
            exit 1
          fi

          items=$(gh project item-list 1 --owner MittenMates --limit 1000 --format json --field Status --field Department)

          # Gameplay Todo -> Andrew, Gameplay Ready for Testing -> Callum,
          # Art Ready for Testing -> Robert.
          mapfile -t assignments < <(
            jq -r '
              .items[]
              | select(
                  ((.department // .Department) == "Gameplay" and
                    ((.status // .Status) == "Todo" or
                     (.status // .Status) == "Ready for Testing"))
                  or
                  ((.department // .Department) == "Art" and
                   (.status // .Status) == "Ready for Testing")
                )
              | select(.content.type == "Issue")
              | select((.content.url // "") | startswith("https://github.com/MittenMates/OmegaStar/issues/"))
              | [(.department // .Department), (.status // .Status), .content.url] | join("|")
            ' <<< "$items"
          )

          for assignment in "${assignments[@]}"; do
            IFS='|' read -r department status url <<< "$assignment"

            if [[ "$department" == "Gameplay" && "$status" == "Todo" ]]; then
              desired="HILEANDR"
              previous="callumtmccole"
            elif [[ "$department" == "Gameplay" ]]; then
              desired="callumtmccole"
              previous="HILEANDR"
            else
              desired="robert3000"
              previous="HILEANDR"
            fi

            echo "Checking $url: $department / $status -> $desired"
            assignees=$(gh issue view "$url" --json assignees --jq '.assignees[].login')

            if ! grep -Fxiq "$desired" <<< "$assignees"; then
              gh issue edit "$url" --add-assignee "$desired"
            fi

            # This is a handoff, so remove the previous primary assignee.
            # Preserve all other contributors.
            if grep -Fxiq "$previous" <<< "$assignees"; then
              gh issue edit "$url" --remove-assignee "$previous"
            fi
          done

          echo "Checked ${#assignments[@]} matching issues."

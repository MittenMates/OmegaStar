name: Assign Gameplay issues by Project status

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assign-by-status:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.OMEGASTAR_PROJECT_TOKEN }}
    steps:
      - name: Assign Gameplay Todo to Andrew and Ready for Testing to Callum
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::warning::Add OMEGASTAR_PROJECT_TOKEN in repository Actions secrets to enable this workflow."
            exit 0
          fi

          # Read the MittenMates Omega Star Development Project.
          items=$(gh project item-list 1 --owner MittenMates --limit 1000 --format json --field Status --field Department)

          # Only process actual OmegaStar repository issues in the Gameplay department,
          # and only for the two status values used for handoffs.
          mapfile -t assignments < <(
            jq -r '
              .items[]
              | select((.department // .Department) == "Gameplay")
              | select((.status // .Status) == "Todo" or
                       (.status // .Status) == "Ready for Testing")
              | select(.content.type == "Issue")
              | select((.content.url // "") | test("^https://github\\.com/MittenMates/OmegaStar/issues/[0-9]+$"; "i"))
              | [(.status // .Status), .content.url] | @tsv
            ' <<< "$items"
          )

          for assignment in "${assignments[@]}"; do
            IFS=$'\t' read -r status url <<< "$assignment"

            if [[ "$status" == "Todo" ]]; then
              desired="HILEANDR"
              previous="callumtmccole"
            else
              desired="callumtmccole"
              previous="HILEANDR"
            fi

            echo "Checking $url: $status -> $desired"
            assignees=$(gh issue view "$url" --json assignees --jq '.assignees[].login')

            # Only update the assignee when needed, to avoid notifications and API calls.
            if ! grep -Fxiq "$desired" <<< "$assignees"; then
              gh issue edit "$url" --add-assignee "$desired"
            fi
            if grep -Fxiq "$previous" <<< "$assignees"; then
              gh issue edit "$url" --remove-assignee "$previous"
            fi
          done

          echo "Checked ${#assignments[@]} matching Gameplay issues."

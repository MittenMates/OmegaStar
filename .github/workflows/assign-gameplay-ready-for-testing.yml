name: Assign Omega Star issues by Department and status

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assign-by-status:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.OMEGASTAR_PROJECT_TOKEN }}
    steps:
      - name: Assign issues using Project status and Department
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::OMEGASTAR_PROJECT_TOKEN is missing."
            exit 1
          fi

          # Query the organization's Project directly via GraphQL.
          # The issue_fields feature header is required to read Department,
          # which is an organization-level Issue field.
          query='
          query($login: String!, $number: Int!, $after: String) {
            organization(login: $login) {
              projectV2(number: $number) {
                items(first: 100, after: $after) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    content {
                      __typename
                      ... on Issue {
                        url
                        repository { nameWithOwner }
                      }
                    }
                    fieldValues(first: 40) {
                      nodes {
                        ... on ProjectV2ItemFieldSingleSelectValue {
                          name
                          field { ... on ProjectV2FieldCommon { name } }
                        }
                        ... on ProjectV2ItemIssueFieldValue {
                          field { ... on ProjectV2FieldCommon { name } }
                          issueFieldValue {
                            ... on IssueFieldSingleSelectValue { name }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }'

          cursor=""
          assignments=()
          while :; do
            args=(graphql -H "GraphQL-Features: issue_fields" -f "query=$query" -f login=MittenMates -F number=1)
            if [[ -n "$cursor" ]]; then
              args+=(-f "after=$cursor")
            fi
            page=$(gh api "${args[@]}")

            if jq -e '.errors // [] | length > 0' <<< "$page" >/dev/null; then
              jq -r '.errors[].message' <<< "$page" >&2
              exit 1
            fi
            if ! jq -e '.data.organization.projectV2.items.nodes | type == "array"' <<< "$page" >/dev/null; then
              echo "::error::Cannot access MittenMates Project #1. Check token project and read:org scopes."
              exit 1
            fi

            # Extract actual repository issues, using the Project Status and
            # organization Issue field Department; comparisons ignore case.
            mapfile -t batch < <(
              jq -r '
                .data.organization.projectV2.items.nodes[]
                | select(.content.__typename == "Issue")
                | select((.content.repository.nameWithOwner // "" | ascii_downcase) == "mittenmates/omegastar")
                | . as $item
                | ([.fieldValues.nodes[]? | select((.field.name // "" | ascii_downcase) == "status") | .name][0] // "") as $status
                | ([.fieldValues.nodes[]? | select((.field.name // "" | ascii_downcase) == "department") | (.issueFieldValue.name // .name)][0] // "") as $department
                | select(
                    (($department | ascii_downcase) == "gameplay" or
                     ($department | ascii_downcase) == "art")
                    and
                    (($status | ascii_downcase) == "todo" or
                     ($status | ascii_downcase) == "ready for testing")
                  )
                | [$department, $status, $item.content.url] | join("|")
              ' <<< "$page"
            )
            assignments+=("${batch[@]}")

            has_more=$(jq -r '.data.organization.projectV2.items.pageInfo.hasNextPage' <<< "$page")
            if [[ "$has_more" != true ]]; then break; fi
            cursor=$(jq -r '.data.organization.projectV2.items.pageInfo.endCursor // empty' <<< "$page")
            if [[ -z "$cursor" ]]; then
              echo "::error::Project pagination returned no cursor."
              exit 1
            fi
          done

          echo "Found ${#assignments[@]} issues matching handoff rules."
          for assignment in "${assignments[@]}"; do
            IFS='|' read -r department status url <<< "$assignment"
            if [[ "${status,,}" == "todo" ]]; then
              desired="hileandr"
            elif [[ "${department,,}" == "gameplay" ]]; then
              desired="callumtmccole"
            else
              desired="robert3000"
            fi

            issue_number="${url##*/}"
            endpoint="repos/MittenMates/OmegaStar/issues/$issue_number"
            current_assignees=$(gh api "$endpoint" --jq '[.assignees[].login]')

            # Retain collaborators unrelated to this handoff and set exactly
            # one of Andrew, Callum, and Robert. GitHub's PATCH /issues endpoint
            # replaces the assignee list atomically.
            payload=$(jq -cn --argjson names "$current_assignees" --arg desired "$desired" '
              {
                assignees: (
                  ($names | map(select(
                    (ascii_downcase != "hileandr") and
                    (ascii_downcase != "callumtmccole") and
                    (ascii_downcase != "robert3000")
                  ))) + [$desired] | unique
                )
              }
            ')

            expected=$(jq -c '[.assignees[] | ascii_downcase] | sort' <<< "$payload")
            actual_before=$(jq -cn --argjson names "$current_assignees" '$names | map(ascii_downcase) | sort')

            if [[ "$actual_before" == "$expected" ]]; then
              echo "Already correct: $url ($department / $status -> $desired)"
              continue
            fi

            echo "Updating $url: $department / $status -> $desired"
            updated=$(gh api --method PATCH "$endpoint" --input - <<< "$payload")
            actual_after=$(jq -c '[.assignees[].login | ascii_downcase] | sort' <<< "$updated")
            if [[ "$actual_after" != "$expected" ]]; then
              echo "::error::Assignees for $url did not match requested assignment."
              echo "Expected: $expected"
              echo "Actual: $actual_after"
              exit 1
            fi
            echo "Verified assignees: $actual_after"
          done

          echo "Finished assignment sync."
